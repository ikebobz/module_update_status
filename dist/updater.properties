# =====================================================================
#  Facility Module Update Agent - settings
#  Lines marked VERIFY must be checked against your application's API
#  before the first rollout (see README "Matching your application's API").
#  Any setting can be overridden by an environment variable:
#  app.auth.password -> UPDATER_APP_AUTH_PASSWORD
# =====================================================================

# ---- This facility (used in status reports) -------------------------
facility.id=1472
facility.name=Coker Aguda PHC

# ---- Where releases come from ---------------------------------------
# Signed release list published by the release team. JAR urls inside it
# may be relative to this location.
manifest.url=https://github.com/ikebobz/module-releases/releases/latest/download/manifest.json
# Public key that release manifests must be signed with
manifest.public-key-file=release-public.pem
# Optional: only accept manifests for this channel (e.g. stable / pilot)
manifest.channel=stable

# ---- Offline / USB updates ------------------------------------------
# Plug in a USB stick that has a "module-updates" folder containing
# manifest.json, manifest.json.sig and the JARs. It is picked up on the next run.
offline.bundle-folder=module-updates
offline.scan-drive-roots=true
# Extra folders to scan (comma separated), e.g. a shared network folder
offline.scan-dirs=

# ---- When to install ------------------------------------------------
# Downloads happen any time. Installs only happen inside this local-time
# window (may span midnight) unless the release is marked "urgent".
# Use "always" to install as soon as an update is ready.
install.window=20:00-06:00
# Install modules from the release list that this facility doesn't have yet?
install.new-modules=false
# Stop retrying a release after this many failed installs (until a newer one ships)
install.max-attempts=3
# Re-install the previous version if the new one fails to come up
rollback.enabled=true

# ---- How often (only used by "run" mode; the scheduled task uses "once") ----
check.interval-minutes=60

# ---- Download behaviour (low-bandwidth friendly) --------------------
download.retries=5
download.retry-initial-seconds=5
# Bandwidth cap in KB/s so updates don't swamp the facility link (0 = no cap)
download.max-kbps=256
http.connect-timeout-seconds=20
http.read-timeout-seconds=120

# ---- The application -------------------------------------------------
app.base-url=http://localhost:9120
# Health URL that returns 2xx when the app is up                       VERIFY
app.api.health=/health
# Optional text that must appear in the health response
app.api.health.expect=

# Authentication: jwt (login endpoint -> bearer token), basic, token, none
app.auth.type=jwt
app.auth.path=/api/v1/authenticate
app.auth.username-field=username
app.auth.password-field=password
app.auth.token-field=id_token
# Use a dedicated admin account for the agent
app.auth.username=guest@lamisplus.org
app.auth.password=12345
# For app.auth.type=token
app.auth.token=

# List installed modules                                              VERIFY
app.api.list-modules=/api/v1/modules/installed
# If the list is wrapped, e.g. {"content":[...]} set this to "content"
app.api.list-modules.items-path=
app.api.modules.name-field=name
app.api.modules.version-field=version
app.api.modules.id-field=id
# Optional boolean field; if set, inactive modules are ignored
app.api.modules.active-field=active

# Upload a module JAR (multipart/form-data)                           VERIFY
app.api.upload=/api/v1/modules/upload
app.api.upload.file-field=file
app.api.upload.id-field=id
# Optional second step after upload. Placeholders: {id} {name} {version}   VERIFY
# Leave blank if uploading alone installs the module.
app.api.install=/api/v1/modules/update
app.api.install.method=POST

# Core version (for min_core_version checks): either a module name from
# the module list, or an endpoint + JSON field. Leave both blank to skip.
app.core.module-name=
app.api.core-version=
app.api.core-version.field=version

# Restart after installing. Leave blank if the app hot-loads modules or
# restarts itself; the agent then just waits for the health URL.       VERIFY
# Example (Windows service):  net stop "LAMISPlus" && net start "LAMISPlus"
app.restart.command=
app.restart.settle-seconds=20
app.restart.timeout-seconds=600

# ---- Central status reporting (optional) -----------------------------
# Each run POSTs this facility's versions and last result as JSON.
report.url=https://script.google.com/macros/s/AKfycbwIujY20RdBFhLuzc9PmFQwBw7s1gdm-EckqfqEEHyrBP6wElhd0UY455VGjjaaXslYfg/exec
report.token=

# ---- Local folders (relative to this file) ---------------------------
updater.state-dir=state
updater.cache-dir=cache
updater.log-dir=logs
# Cached versions kept per module (current + one for rollback)
updater.cache-keep-versions=2
